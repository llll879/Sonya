<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121420">
<title>Соня</title>
<style>
  :root { --bg:#121420; --card:#1c2030; --me:#3b5bdb; --text:#e8eaf2; --dim:#8b90a5; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px)); background:var(--card); }
  header h1 { font-size:18px; margin:0; }
  button { font:inherit; border:0; border-radius:12px; padding:10px 14px; background:var(--me); color:#fff; }
  button.ghost { background:transparent; color:var(--dim); padding:6px 10px; }
  #log { flex:1; overflow-y:auto; padding:12px 12px 4px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--card); }
  .sys { align-self:center; color:var(--dim); font-size:13px; }
  form { display:flex; gap:8px; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); }
  input,textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid #2c3247; border-radius:12px; padding:10px 12px; width:100%; }
  form input { flex:1; }
  #mic.on { background:#e03131; }
  dialog { background:var(--card); color:var(--text); border:0; border-radius:16px; width:min(92vw,420px); }
  dialog label { display:block; margin:10px 0 4px; color:var(--dim); font-size:14px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Соня</h1>
  <div><button class="ghost" id="voiceBtn">🔊</button><button class="ghost" id="settingsBtn">⚙️</button></div>
</header>
<div id="log"></div>
<form id="form">
  <button type="button" id="mic">🎤</button>
  <input id="input" placeholder="Напиши или скажи…" autocomplete="off">
  <button>➤</button>
</form>

<dialog id="dlg">
  <h3 style="margin-top:0">Настройки</h3>
  <label>Адрес сервера (пусто — этот же сайт)</label>
  <input id="sUrl" placeholder="https://xxx.onrender.com" autocapitalize="off">
  <label>APP_TOKEN</label>
  <input id="sToken" type="password" autocapitalize="off">
  <label>Имя ассистента</label>
  <input id="sName">
  <div class="row"><button class="ghost" id="clearBtn">Очистить чат</button><button id="saveBtn">Сохранить</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const S = {
  get url(){ return (localStorage.url || "").trim().replace(/\/$/, ""); },
  get token(){ return localStorage.token || ""; },
  get name(){ return localStorage.name || "Соня"; },
  get voice(){ return localStorage.voice !== "0"; },
};
const base = () => S.url || (location.protocol.startsWith("http") ? location.origin : "");
let contents = [];

function add(cls, text){
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9; return d;
}
function refresh(){ $("title").textContent = S.name; $("voiceBtn").textContent = S.voice ? "🔊" : "🔇"; }

async function post(path, body){
  const r = await fetch(base() + path, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-app-token": S.token },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    let t = ""; try { t = (await r.json()).detail; } catch(e){}
    throw new Error(t || ("Сервер ответил " + r.status));
  }
  return r;
}

let audio;
async function speak(text){
  if (!S.voice || !text) return;
  try {
    const r = await post("/tts", { text });
    const blob = await r.blob();
    if (audio) audio.pause();
    audio = new Audio(URL.createObjectURL(blob));
    await audio.play();
  } catch(e) {  // нет Fish на сервере — голос браузера
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ru-RU";
    speechSynthesis.speak(u);
  }
}

async function send(text){
  text = text.trim(); if (!text) return;
  if (!S.token) { add("sys", "Сначала впиши APP_TOKEN в настройках ⚙️"); return; }
  add("me", text);
  contents.push({ role:"user", parts:[{ text }] });
  contents = contents.slice(-40);
  const wait = add("sys", "думаю…");
  try {
    const r = await post("/chat", { contents, assistantName: S.name, tools: false });
    const j = await r.json();
    contents.push(j.content);
    wait.remove();
    add("bot", j.text || "…");
    speak(j.text);
  } catch(e) {
    wait.remove(); contents.pop();
    add("sys", "Ошибка: " + e.message);
  }
}

$("form").onsubmit = e => { e.preventDefault(); const v = $("input").value; $("input").value = ""; send(v); };

// Микрофон (распознавание речи браузера / WebView)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec;
$("mic").onclick = () => {
  if (!SR) { add("sys", "Здесь нет распознавания речи — пиши текстом"); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = false;
  rec.onstart = () => $("mic").classList.add("on");
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onerror = e => add("sys", "Микрофон: " + e.error);
  rec.onend = () => { $("mic").classList.remove("on"); rec = null; };
  rec.start();
};

$("voiceBtn").onclick = () => { localStorage.voice = S.voice ? "0" : "1"; refresh(); };
$("settingsBtn").onclick = () => { $("sUrl").value = S.url; $("sToken").value = S.token; $("sName").value = S.name; $("dlg").showModal(); };
$("saveBtn").onclick = () => { localStorage.url = $("sUrl").value; localStorage.token = $("sToken").value; localStorage.name = $("sName").value.trim() || "Соня"; $("dlg").close(); refresh(); };
$("clearBtn").onclick = () => { contents = []; $("log").innerHTML = ""; $("dlg").close(); };

refresh();
add("sys", "Привет! Я " + S.name + ".");
if (!S.token) add("sys", "Открой ⚙️ и впиши APP_TOKEN.");
if (base()) fetch(base() + "/health").catch(() => {});  // будим Render
</script>
</body>
</html>
